[project]
name = "hll-discord-bot"
version = "0.1.0"
description = "A Discord bot for Hell Let Loose that responds to greetings"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "discord.py>=2.3.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["database"]

[tool.uv]
dev-dependencies = []
